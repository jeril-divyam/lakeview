[package]
name = "lakeview"
version = "0.1.1"
edition = "2024"
description = "A terminal browser for lakeFS"
license = "MIT"
readme = "README.md"
keywords = ["lakefs", "tui", "ratatui", "data"]
categories = ["command-line-utilities"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.33"
humansize = "2.1.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
# A loopback socket to serve a canned response to the download test. reqwest
# already turns this feature on, so it costs the binary nothing.
tokio = { version = "1.53.1", features = ["net"] }
